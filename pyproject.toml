[project]
name = "droppedneedle-mbid-artist-merge"
version = "0.1.0"
description = "DroppedNeedle plugin: merge local-only artists into the MusicBrainz-linked artist their files' MBIDs point to."
requires-python = ">=3.13"
# Runtime code uses only the standard library plus the HTTP client the
# DroppedNeedle host injects. Nothing to install on the server.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx==0.28.1",  # same version as DroppedNeedle v2.15.0; tests only
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".cache"]

[tool.ruff.lint]
extend-select = ["I", "B"]
